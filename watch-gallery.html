<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>時計仕入れギャラリー</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surf:#161b24;--surf2:#1e2535;--bdr:#2a3348;
  --txt:#e4e8f4;--mut:#6e7a9e;
  --acc:#f5a623;--acc-lo:rgba(245,166,35,.12);
  --blu:#4f8ef7;--blu-lo:rgba(79,142,247,.1);
  --grn:#3fb950;--grn-lo:rgba(63,185,80,.12);--red:#f87171;
  --jp:'Noto Sans JP',sans-serif;
  --ui:'DM Sans',var(--jp),sans-serif;
}
html,body{height:100%;width:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:14px}
#root{min-height:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--bdr);background:var(--surf);flex-shrink:0}
.topbar h1{font-size:15px;font-weight:700;color:var(--acc)}
.backbtn{padding:6px 12px;border:1px solid var(--bdr);border-radius:6px;background:var(--surf2);color:var(--txt);cursor:pointer;font-size:13px}
.backbtn:hover{border-color:var(--acc);color:var(--acc)}
.main{flex:1;padding:24px;max-width:1400px;width:100%;margin:0 auto}

/* ── brand grid ── */
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media (max-width:900px){.bgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.bgrid{grid-template-columns:repeat(2,1fr)}}
.bcard{border:1px solid var(--bdr);border-radius:10px;background:var(--surf);padding:20px 14px;text-align:center;cursor:pointer;transition:all .15s}
.bcard:hover{border-color:var(--acc);background:var(--surf2)}
.bcard .bname{font-size:15px;font-weight:700;margin-bottom:6px}
.bcard .bcount{font-size:11px;color:var(--mut)}

/* ── product grid ── */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:1100px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.pgrid{grid-template-columns:repeat(2,1fr);gap:12px}}
.pcard{border:1px solid var(--bdr);border-radius:12px;background:var(--surf);overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.pcard:hover{border-color:var(--acc)}
.pcard .thumb{width:100%;aspect-ratio:1;background:var(--surf2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .thumb .noimg{color:var(--mut);font-size:13px}
.pcard .popbadge{position:absolute;top:10px;left:10px;background:var(--acc);color:#000;font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px}
.pcard .pinfo{padding:14px 16px}
.pcard .pname{font-size:16px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pline{font-size:13px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pmust{font-size:12px;color:var(--red);margin-top:4px}

.addcard{border:1px dashed var(--bdr);border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:160px;color:var(--mut);font-size:13px;transition:all .15s}
.addcard:hover{border-color:var(--acc);color:var(--acc)}

/* ── modal ── */
.epage{width:100%}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mhead h2{font-size:18px;font-weight:700}
.mclose{padding:6px 14px;border:1px solid var(--bdr);border-radius:6px;background:var(--surf2);color:var(--txt);cursor:pointer;font-size:13px}
.mclose:hover{border-color:var(--acc);color:var(--acc)}

.mbody{display:flex;gap:32px;align-items:flex-start}
@media (max-width:900px){.mbody{flex-direction:column}}
.mphotocol{flex:0 0 560px;display:flex;flex-direction:column;gap:14px;position:sticky;top:24px}
@media (max-width:900px){.mphotocol{flex:none;width:100%;position:static}}
.mformcol{flex:1;min-width:0;max-width:640px}

.mainphoto{width:100%;aspect-ratio:1;background:var(--bg);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mainphoto img{width:100%;height:100%;object-fit:contain;display:block}
.mainphoto .noimg{color:var(--mut);font-size:14px}
.thumbstrip{display:flex;gap:10px;flex-wrap:wrap}
.thumbstrip .tsimg{width:110px;height:110px;border-radius:10px;overflow:hidden;border:3px solid var(--bdr);cursor:pointer;position:relative;flex-shrink:0}
.thumbstrip .tsimg.active{border-color:var(--acc)}
.thumbstrip .tsimg img{width:100%;height:100%;object-fit:cover;display:block}
.tsimg .parttag{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.72);color:#fff;font-size:11px;text-align:center;line-height:1.7;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

label{font-size:13px;color:var(--mut);display:flex;align-items:center;margin:16px 0 6px}
label:first-of-type{margin-top:0}
.fieldicon{width:48px;height:48px;object-fit:contain;margin-right:9px;opacity:.95;flex-shrink:0}
input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);font-family:var(--ui);font-size:14px;padding:9px 12px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:50px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fieldwithphotos{display:flex;gap:8px;align-items:flex-start}
.fieldwithphotos>div:first-child{flex:1}
.minithumbs{display:flex;gap:4px;flex-shrink:0;padding-top:20px}
.minithumbs .mt{width:32px;height:32px;border-radius:5px;overflow:hidden;border:2px solid var(--bdr);cursor:pointer}
.minithumbs .mt.active{border-color:var(--acc)}
.minithumbs .mt img{width:100%;height:100%;object-fit:cover;display:block}

.popcheck{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--bdr);border-radius:6px;cursor:pointer;background:var(--bg);user-select:none;width:fit-content}
.popcheck.on{border-color:var(--acc);background:var(--acc-lo)}
.popcheck input{accent-color:var(--acc)}

.dz{border:2px dashed var(--bdr);border-radius:9px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;font-size:12px}
.dz:hover,.dz.drag{border-color:var(--acc);background:var(--acc-lo)}
.captioninput{width:100%;margin-top:6px;background:var(--surf2);border:1px solid var(--bdr);border-radius:5px;color:var(--txt);font-family:var(--ui);font-size:11px;padding:5px 7px;outline:none}
.captioninput:focus{border-color:var(--acc)}
.uploadmini{position:relative}
.uploadmini .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:11px;z-index:2}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.photocard{border:1px solid var(--bdr);border-radius:8px;padding:6px;background:var(--bg)}
.photocard .pcimg{width:100%;aspect-ratio:1;border-radius:5px;overflow:hidden;background:var(--surf2);position:relative}
.photocard .pcimg img{width:100%;height:100%;object-fit:cover;display:block}
.photocardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}

.mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:600;transition:all .15s}
.btn:disabled{opacity:.5;pointer-events:none}
.bprim{background:var(--acc);color:#000}.bprim:hover{background:#e69520}
.bsec{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr)}.bsec:hover{border-color:var(--acc)}
.bdanger{background:transparent;color:var(--red);border:1px solid var(--bdr)}.bdanger:hover{border-color:var(--red)}

.empty{text-align:center;padding:60px 16px;color:var(--mut)}
.empty h3{color:var(--txt);font-size:14px;margin-bottom:6px}
</style>
</head>

window.onerror = function(msg, url, line) {
  document.getElementById('root').innerHTML =

};
</script>

function loadEntries(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveEntries(entries){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }catch(e){}
}

// 全角数字を半角に変換（それ以外の文字はそのまま）
function toHalfWidthDigits(str){
  if(!str) return str;
  return str.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
}

async function uploadToCloudinary(base64) {
  const blob = await fetch(base64).then(r => r.blob());
  const fd = new FormData();
  fd.append('file', blob, 'photo.jpg');
  fd.append('upload_preset', 'ebay-calc');
  const res = await fetch('https://api.cloudinary.com/v1_1/dlsmimq4x/image/upload', {
    method: 'POST', body: fd
  });
  if (!res.ok) throw new Error('Cloudinary upload failed: ' + res.status);
  const data = await res.json();
  return data.secure_url;
}

  return {
    id: 'w'+Date.now()+Math.random().toString(36).slice(2,7),
    brand,
    lineName: '',
    refNote: '',
    dial: '',
    belt: '',
    bezel: '',
    gender: '',
    mustCondition: '',
    priceNote: '',
    popular: false,
    notes: '',
    photos: [] // {id, url, cloudinaryUrl, uploading, caption}
  };
}

function PhotoManager({photos, onChange}){
  const [dragging, setDragging] = useState(false);
  const fileRef = useRef(null);

  const handleFiles = (files) => {
    Array.from(files).forEach(file => {
      const reader = new FileReader();
      reader.onload = () => {
        const localId = 'p'+Date.now()+Math.random().toString(36).slice(2,5);
        const next = [...photos, {id:localId, url:reader.result, cloudinaryUrl:null, uploading:true, caption:''}];
        onChange(next);
        uploadToCloudinary(reader.result).then(cloudinaryUrl => {
          onChange(prev => prev.map(p => p.id===localId ? {...p, cloudinaryUrl, uploading:false} : p));
        }).catch(()=>{
          onChange(prev => prev.map(p => p.id===localId ? {...p, uploading:false, error:true} : p));
        });
      };
      reader.readAsDataURL(file);
    });
  };

  const setCaption = (id, caption) => {
    onChange(photos.map(p => p.id===id ? {...p, caption} : p));
  };
  const removePhoto = (id) => {
    onChange(photos.filter(p=>p.id!==id));
  };

  return (
    <div>
      <div className={`dz ${dragging?'drag':''}`}
        onClick={()=>fileRef.current.click()}
        onDragOver={e=>{e.preventDefault();setDragging(true);}}
        onDragLeave={()=>setDragging(false)}
        onDrop={e=>{e.preventDefault();setDragging(false);handleFiles(e.dataTransfer.files);}}>
        写真をドラッグ＆ドロップ、またはクリックして選択
      </div>
      <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}}
        onChange={e=>{handleFiles(e.target.files); e.target.value='';}} />
      {photos.length>0 &&
        <div className="photocardgrid">
          {photos.map(p=>(
            <div key={p.id} className="photocard">
              <div className="pcimg uploadmini">
                <img src={p.cloudinaryUrl || p.url} alt="" />
                {p.uploading && <span className="spin" style={{position:'absolute',bottom:4,left:4}}></span>}
                <button className="rm" onClick={()=>removePhoto(p.id)}>×</button>
              </div>
              <input type="text" className="captioninput" value={p.caption||''} placeholder="例: ダイアル黒"
                onChange={e=>setCaption(p.id, e.target.value)} />
            </div>
          ))}
        </div>
      }
    </div>
  );
}

function EntryPage({entry, onSave, onDelete, onClose}){
  const [draft, setDraft] = useState(entry);
  const [selectedPhotoId, setSelectedPhotoId] = useState(entry.photos[0] ? entry.photos[0].id : null);
  const set = (field) => (e) => setDraft({...draft, [field]: e.target.value});
  const setPhotos = (updater) => setDraft(d => {
    const next = typeof updater==='function' ? updater(d.photos) : updater;
    return {...d, photos: next};
  });
  const priceBlur = () => setDraft(d => ({...d, priceNote: toHalfWidthDigits(d.priceNote)}));

  const selectedPhoto = draft.photos.find(p=>p.id===selectedPhotoId) || draft.photos[0];

  useEffect(()=>{
    if(!draft.photos.find(p=>p.id===selectedPhotoId) && draft.photos[0]){
      setSelectedPhotoId(draft.photos[0].id);
    }
  }, [draft.photos]);

  return (
    <div className="epage">
      <div className="mhead">
        <button className="mclose" onClick={onClose}>← 戻る</button>
        <h2>{draft.brand}{draft.lineName ? ' / ' + draft.lineName : ' - 新規モデル'}</h2>
        <div style={{width:70}}></div>
      </div>

        <div className="mbody">
          {/* ── 左：写真 ── */}
          <div className="mphotocol">
            <div className="mainphoto">
              {selectedPhoto ? <img src={selectedPhoto.cloudinaryUrl || selectedPhoto.url} alt="" /> : <span className="noimg">写真なし</span>}
            </div>
            {draft.photos.length>0 &&
              <div className="thumbstrip">
                {draft.photos.map(p=>(
                  <div key={p.id} className={`tsimg ${selectedPhotoId===p.id?'active':''}`} onClick={()=>setSelectedPhotoId(p.id)}>
                    <img src={p.cloudinaryUrl || p.url} alt="" />
                    {p.caption && <span className="parttag">{p.caption}</span>}
                  </div>
                ))}
              </div>
            }
            <label>写真管理（部位タグ付け）</label>
            <PhotoManager photos={draft.photos} onChange={setPhotos} />
          </div>

          {/* ── 右：フォーム ── */}
          <div className="mformcol">
            <div className={`popcheck ${draft.popular?'on':''}`} onClick={()=>setDraft({...draft, popular:!draft.popular})}>
              <input type="checkbox" readOnly checked={draft.popular} />
              <span>人気モデル</span>
            </div>

            <label>モデル名</label>
            <input type="text" value={draft.lineName} onChange={set('lineName')} placeholder="例: バルボア、Hウォッチ、1500L" />

            <label>型番メモ（有無・パターン・調べ方）</label>
            <textarea value={draft.refNote} onChange={set('refNote')} placeholder="例: 型番なし／L1から始まる／HH1.201のように枝番あり" />

            <label><img className="fieldicon" src={ICON_DIAL} alt="" />ダイアル色</label>
            <input type="text" value={draft.dial} onChange={set('dial')} placeholder="白、金" />

            <label><img className="fieldicon" src={ICON_BELT} alt="" />ベルト（色・素材・社外品可否）</label>
            <input type="text" value={draft.belt} onChange={set('belt')} placeholder="コンビ（金＋銀）、社外OK" />

            <label><img className="fieldicon" src={ICON_BEZEL} alt="" />ベゼル</label>
            <input type="text" value={draft.bezel} onChange={set('bezel')} placeholder="金、黒" />

            <label>性別</label>
            <input type="text" value={draft.gender} onChange={set('gender')} placeholder="女性用のみ／基本男性用／両方可" />

            <label>価格目安（自由記述、複数可）</label>
            <input type="text" value={draft.priceNote} onChange={set('priceNote')} onBlur={priceBlur} placeholder="仕入上限: ¥50,000, 相場: ¥65,000" />

            <label>必須条件（これが揃ってないと売れない等）</label>
            <input type="text" value={draft.mustCondition} onChange={set('mustCondition')} placeholder="箱＋替えベルト6本セット" />

            <label>備考（一覧には出ず、ここでのみ表示）</label>
            <textarea value={draft.notes} onChange={set('notes')} placeholder="自由に書いてOK" />

            <div className="mfoot">
              <div>
                {onDelete && <button className="btn bdanger" onClick={()=>{ if(confirm('このモデルを削除しますか？')) onDelete(draft.id); }}>削除</button>}
              </div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn bsec" onClick={onClose}>キャンセル</button>
                <button className="btn bprim" onClick={()=>onSave({...draft, priceNote: toHalfWidthDigits(draft.priceNote)})} disabled={!draft.lineName.trim()}>保存</button>
              </div>
            </div>
          </div>
        </div>
    </div>
  );
}

function BrandGrid({entries, onSelectBrand}){
  return (
    <div className="bgrid">
      {BRANDS.map(b=>{
        const count = entries.filter(e=>e.brand===b).length;
        return (
          <div key={b} className="bcard" onClick={()=>onSelectBrand(b)}>
            <div className="bname">{b}</div>
            <div className="bcount">{count}モデル登録済み</div>
          </div>
        );
      })}
    </div>
  );
}

function BrandDetail({brand, entries, onBack, onOpenEntry, onNewEntry}){
  const list = entries.filter(e=>e.brand===brand);
  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
        <button className="backbtn" onClick={onBack}>← ブランド一覧</button>
        <h2 style={{fontSize:16,fontWeight:700}}>{brand}</h2>
      </div>
      {list.length===0 ? (
        <div className="empty">
          <h3>まだ登録がありません</h3>
          <p style={{fontSize:12,marginBottom:16}}>最初のモデルを追加してみましょう</p>
          <button className="btn bprim" onClick={onNewEntry}>＋ モデルを追加</button>
        </div>
      ) : (
        <div className="pgrid">
          {list.map(e=>{
            const cover = e.photos && e.photos[0];
            return (
              <div key={e.id} className="pcard" onClick={()=>onOpenEntry(e)}>
                <div className="thumb">
                  {cover ? <img src={cover.cloudinaryUrl || cover.url} alt="" /> : <span className="noimg">写真なし</span>}
                  {e.popular && <span className="popbadge">人気</span>}
                </div>
                <div className="pinfo">
                  <div className="pname">{e.lineName}</div>
                  {e.priceNote && <div className="pline">{e.priceNote}</div>}
                  {e.mustCondition && <div className="pmust">⚠ {e.mustCondition}</div>}
                </div>
              </div>
            );
          })}
          <div className="addcard" onClick={onNewEntry}>＋ モデルを追加</div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [entries, setEntries] = useState(loadEntries());
  const [view, setView] = useState('brands');
  const [selectedBrand, setSelectedBrand] = useState(null);
  const [editingEntry, setEditingEntry] = useState(null);

  useEffect(()=>{ saveEntries(entries); }, [entries]);

  const handleSave = (draft) => {
    setEntries(prev => {
      const exists = prev.some(e=>e.id===draft.id);
      return exists ? prev.map(e=>e.id===draft.id?draft:e) : [...prev, draft];
    });
    setEditingEntry(null);
  };
  const handleDelete = (id) => {
    setEntries(prev => prev.filter(e=>e.id!==id));
    setEditingEntry(null);
  };

  return (
    <div className="app">
      <div className="topbar">
        <h1>⌚ 時計仕入れギャラリー</h1>
      </div>
      <div className="main">
        {!editingEntry && view==='brands' &&
          <BrandGrid entries={entries} onSelectBrand={(b)=>{setSelectedBrand(b);setView('detail');}} />
        }
        {!editingEntry && view==='detail' &&
          <BrandDetail
            brand={selectedBrand}
            entries={entries}
            onBack={()=>setView('brands')}
            onOpenEntry={(e)=>setEditingEntry(e)}
            onNewEntry={()=>setEditingEntry(emptyEntry(selectedBrand))}
          />
        }
        {editingEntry &&
          <EntryPage
            entry={editingEntry}
            onSave={handleSave}
            onDelete={entries.some(e=>e.id===editingEntry.id) ? handleDelete : null}
            onClose={()=>setEditingEntry(null)}
          />
        }
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
