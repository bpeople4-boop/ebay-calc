<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>時計仕入れギャラリー</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surf:#161b24;--surf2:#1e2535;--bdr:#2a3348;
  --txt:#e4e8f4;--mut:#6e7a9e;
  --acc:#f5a623;--acc-lo:rgba(245,166,35,.12);
  --grn:#3fb950;--red:#f87171;
  --jp:'Noto Sans JP',sans-serif;
  --ui:'DM Sans',var(--jp),sans-serif;
}
html,body{height:100%;width:100%;background:#0d1117}
body{color:var(--txt);font-family:var(--ui);font-size:14px;-webkit-text-size-adjust:100%}
#root{min-height:100%;background:var(--bg)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

.app{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bdr);background:var(--surf);position:sticky;top:0;z-index:30}
.topbar h1{font-size:14px;font-weight:700;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{font-size:11px;color:var(--mut);margin-top:2px}
.backbtn{padding:7px 12px;border:1px solid var(--bdr);border-radius:7px;background:var(--surf2);color:var(--txt);cursor:pointer;font-size:13px;flex-shrink:0}
.backbtn:hover{border-color:var(--acc);color:var(--acc)}
.main{flex:1;padding:16px;max-width:1200px;width:100%;margin:0 auto}
@media(min-width:900px){.main{padding:24px}}

/* ── 1. ブランド ── */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.bgrid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.bgrid{grid-template-columns:repeat(5,1fr)}}
.bcard{border:1px solid var(--bdr);border-radius:11px;background:var(--surf);padding:18px 12px;text-align:center;cursor:pointer;transition:all .15s}
.bcard:hover{border-color:var(--acc);background:var(--surf2)}
.bcard .bname{font-size:15px;font-weight:700;margin-bottom:5px}
.bcard .bcount{font-size:11px;color:var(--mut)}

/* ── 2. ライン ── */
.lgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.lgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.lgrid{grid-template-columns:repeat(3,1fr)}}
.lcard{display:flex;align-items:center;gap:12px;border:1px solid var(--bdr);border-radius:11px;background:var(--surf);padding:10px;cursor:pointer;transition:all .15s}
.lcard:hover{border-color:var(--acc)}
.lcard .lthumb{width:64px;height:64px;border-radius:9px;overflow:hidden;background:var(--surf2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px}
.lcard .lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .lname{font-size:15px;font-weight:700}
.lcard .lmeta{font-size:11.5px;color:var(--mut);margin-top:4px}
.addline{border:1px dashed var(--bdr);border-radius:11px;padding:16px;text-align:center;color:var(--mut);cursor:pointer;font-size:13px}
.addline:hover{border-color:var(--acc);color:var(--acc)}

/* ── 3. 共通情報 + バリエーション一覧 ── */
.commonbox{border:1px solid var(--bdr);border-left:3px solid var(--acc);border-radius:10px;background:var(--surf);padding:14px;margin-bottom:18px}
.commonbox h3{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.04em;margin-bottom:8px}
.commonbox .ctext{font-size:13px;line-height:1.85;white-space:pre-wrap}
.commonbox .cempty{font-size:12.5px;color:var(--mut)}
.commonedit{float:right;font-size:11px;color:var(--mut);background:none;border:none;cursor:pointer;text-decoration:underline}
.commonedit:hover{color:var(--acc)}

.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.vgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.vgrid{grid-template-columns:repeat(4,1fr)}}
.vcard{border:1px solid var(--bdr);border-radius:11px;background:var(--surf);overflow:hidden;cursor:pointer;position:relative;transition:all .15s}
.vcard:hover{border-color:var(--acc)}
.vcard.isng{border-color:var(--red)}
.vcard .vimg{width:100%;aspect-ratio:1;background:var(--surf2);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mut);font-size:12px}
.vcard .vimg img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .vfoot{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.88) 35%);padding:26px 9px 8px}
.vcard .vlabel{font-size:12.5px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9);margin-bottom:3px}
.vcard .vprices{display:flex;flex-direction:column;gap:1px}
.vcard .prow{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.vcard .pcond{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.02em;flex-shrink:0}
.vcard .pval{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.vcard .pnone{font-size:11.5px;color:var(--mut);text-align:right}
.vcard .vng{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;z-index:2}
.addcard{border:1px dashed var(--bdr);border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;aspect-ratio:1;color:var(--mut);font-size:13px}
.addcard:hover{border-color:var(--acc);color:var(--acc)}

/* ── 4. バリエーション詳細 ── */
.dbody{display:flex;flex-direction:column;gap:18px}
@media(min-width:900px){.dbody{flex-direction:row;align-items:flex-start;gap:28px}
  .dphoto{flex:0 0 440px;position:sticky;top:80px}
  .dform{flex:1;min-width:0;max-width:640px}}
.mainphoto{width:100%;aspect-ratio:1;background:var(--bg);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.mainphoto img{width:100%;height:100%;object-fit:contain;display:block}
.thumbstrip{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tsimg{width:72px;height:72px;border-radius:9px;overflow:hidden;border:3px solid var(--bdr);cursor:pointer;position:relative;flex-shrink:0}
.tsimg.active{border-color:var(--acc)}
.tsimg img{width:100%;height:100%;object-fit:cover;display:block}
.tsimg .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.72);color:#fff;border:none;border-radius:4px;width:20px;height:20px;cursor:pointer;font-size:11px;z-index:2}
.dz{border:2px dashed var(--bdr);border-radius:9px;padding:14px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut);margin-top:10px;transition:all .2s}
.dz:hover,.dz.drag{border-color:var(--acc);background:var(--acc-lo);color:var(--acc)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.ceilingbox{margin-top:12px;border:1px solid var(--bdr);border-radius:10px;background:var(--surf);padding:12px 14px}
.ceilingbox .clabel{font-size:11px;color:var(--mut);letter-spacing:.04em;margin-bottom:6px}
.ceilingrow{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.ceilingrow .ccond{font-size:11.5px;font-weight:600;color:var(--mut);width:66px;flex-shrink:0}
.ceilingrow .yen{font-size:16px;color:var(--acc);font-weight:700}
.ceilingrow input{flex:1;min-width:0;font-size:22px;font-weight:700;color:var(--acc);background:transparent;border:none;border-bottom:1px solid var(--bdr);padding:2px 0;outline:none;font-family:var(--ui)}
.ceilingrow input:focus{border-color:var(--acc)}

.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0}
.linkbtn{flex-shrink:0;padding:0 14px;border-radius:7px;border:1px solid var(--bdr);background:var(--surf2);color:var(--txt);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center}
.linkbtn:hover{border-color:var(--acc);color:var(--acc)}
.linkbtn.off{opacity:.35;pointer-events:none}

label{font-size:12.5px;color:var(--mut);display:flex;align-items:center;margin:16px 0 6px}
.fieldicon{width:64px;height:64px;object-fit:contain;margin-right:10px;opacity:.95;flex-shrink:0}
@media(min-width:900px){.fieldicon{width:96px;height:96px;margin-right:12px}}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:7px;color:var(--txt);font-family:var(--ui);font-size:15px;padding:10px 12px;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:52px;line-height:1.7}
.ngcheck{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--bdr);border-radius:7px;cursor:pointer;background:var(--bg);user-select:none;width:fit-content;font-size:13px;margin-top:16px}
.ngcheck.on{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red)}
.ngcheck input{accent-color:var(--red)}

.dfoot{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--bdr)}
.btn{padding:10px 18px;border-radius:7px;border:none;cursor:pointer;font-family:var(--ui);font-size:14px;font-weight:600;transition:all .15s}
.bprim{background:var(--acc);color:#000}.bprim:hover{background:#e69520}
.bsec{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr)}.bsec:hover{border-color:var(--acc)}
.bdanger{background:transparent;color:var(--red);border:1px solid var(--bdr)}.bdanger:hover{border-color:var(--red)}
.bdangeron{background:var(--red);color:#fff;border:1px solid var(--red)}
.inlineform{border:1px solid var(--acc);border-radius:11px;background:var(--surf);padding:12px;margin-top:10px}
.inlinebtns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}
.empty h3{color:var(--txt);font-size:14px;margin-bottom:6px}
.upnote{font-size:11.5px;color:var(--acc)}
.dirtynote{font-size:11.5px;color:var(--acc);margin-top:8px;text-align:right}
.btn:disabled{opacity:.4;cursor:default}
.backupbar{margin-top:28px;border:1px solid var(--bdr);border-radius:11px;background:var(--surf);padding:14px}
.bkhead{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.04em}
.bkmeta{font-size:11.5px;color:var(--mut);margin-top:5px}
.bkbtns{display:flex;gap:8px;margin-top:10px}
.bkerr{font-size:12px;color:var(--red);margin-top:10px;line-height:1.7}
.bkconfirm{margin-top:12px;border:1px solid var(--acc);border-radius:9px;background:var(--acc-lo);padding:12px;font-size:12.5px;line-height:1.8}
.saved{font-size:11px;color:var(--grn);margin-left:auto;flex-shrink:0}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.onerror=function(m,u,l){document.getElementById('root').innerHTML='<div style="padding:40px;font-family:sans-serif;color:#f87171">Error: '+m+' (line '+l+')</div>';};
window.addEventListener('load',function(){
  if(typeof React==='undefined'||typeof ReactDOM==='undefined'||typeof Babel==='undefined'){
    document.getElementById('root').innerHTML='<div style="padding:40px;font-family:sans-serif;color:#f87171">ライブラリの読み込みに失敗しました。通信環境を確認して再読み込みしてください。</div>';
  }
});
</script>

/* ── 保存・読み込み ── */
function loadLines(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveLines(lines){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(lines)); }catch(e){}
}
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const yen = n => n ? '¥' + Number(n).toLocaleString('ja-JP') : '';
const digitsOnly = s => (s||'').replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).replace(/[^0-9]/g,'');

function exportBackup(lines){
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const blob = new Blob([JSON.stringify({app:'watch-gallery', version:2, exportedAt:new Date().toISOString(), lines}, null, 2)],
    {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'watch-gallery-' + stamp + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function BackupBar({lines, onReplace}){
  const fileRef = useRef(null);
  const [msg,setMsg] = useState('');
  const [pending,setPending] = useState(null);
  const total = lines.reduce((n,l)=>n+l.vars.length, 0);

  const readFile = file => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const obj = JSON.parse(r.result);
        const arr = Array.isArray(obj) ? obj : obj.lines;
        if(!Array.isArray(arr)) throw new Error('形式が違います');
        setPending(arr); setMsg('');
      }catch(e){ setPending(null); setMsg('読み込めませんでした。書き出したJSONファイルを選んでください。'); }
    };
    r.readAsText(file);
  };

  return (
    <div className="backupbar">
      <div className="bkhead">データの持ち出し・取り込み</div>
      <div className="bkmeta">今このブラウザに {lines.length}ライン / {total}バリエーション</div>
      <div className="bkbtns">
        <button className="btn bsec" onClick={()=>exportBackup(lines)}>書き出し</button>
        <button className="btn bsec" onClick={()=>fileRef.current.click()}>読み込み</button>
      </div>
      <input ref={fileRef} type="file" accept="application/json,.json" style={{display:'none'}}
        onChange={e=>{ if(e.target.files[0]) readFile(e.target.files[0]); e.target.value=''; }} />
      {msg && <div className="bkerr">{msg}</div>}
      {pending &&
        <div className="bkconfirm">
          読み込むファイル：{pending.length}ライン / {pending.reduce((n,l)=>n+(l.vars?l.vars.length:0),0)}バリエーション<br/>
          <b>今このブラウザにあるデータは全部消えて、上のデータに入れ替わります。</b>
          <div className="bkbtns" style={{marginTop:10}}>
            <button className="btn bsec" onClick={()=>setPending(null)}>やめる</button>
            <button className="btn bprim" onClick={()=>{ onReplace(pending); setPending(null); setMsg('入れ替えました。'); }}>入れ替える</button>
          </div>
        </div>}
    </div>
  );
}

async function uploadToCloudinary(base64){
  const blob = await fetch(base64).then(r=>r.blob());
  const fd = new FormData();
  fd.append('file', blob, 'photo.jpg');
  fd.append('upload_preset', 'ebay-calc');
  const res = await fetch('https://api.cloudinary.com/v1_1/dlsmimq4x/image/upload', { method:'POST', body:fd });
  if(!res.ok) throw new Error('Cloudinary upload failed: ' + res.status);
  const data = await res.json();
  return data.secure_url;
}

function emptyLine(brand){
  return { id: uid('l'), brand, name:'', common:'', vars:[] };
}
function emptyVar(){
  return { id: uid('v'), label:'', ceilingExc:'', ceilingNM:'', priceMemo:'', yahoo:'', ebay:'',
           caseNote:'', dial:'', belt:'', bezel:'', notes:'', ng:false, photos:[] };
}
const coverOf = v => (v.photos && v.photos[0]) || null;
const srcOf = p => p ? (p.cloudinaryUrl || p.url) : null;

/* ══════════ App ══════════ */
function App(){
  const [lines, setLines] = useState(loadLines);
  const [view, setView] = useState({page:'brands'});
  useEffect(()=>{ saveLines(lines); }, [lines]);

  const linesOf = b => lines.filter(l=>l.brand===b);
  const line = view.lineId ? lines.find(l=>l.id===view.lineId) : null;
  const vari = line && view.varId ? line.vars.find(v=>v.id===view.varId) : null;

  const patchLine = (id,patch) => setLines(ls=>ls.map(l=>l.id===id?{...l,...patch}:l));
  const patchVar = (lid,vid,patch) => setLines(ls=>ls.map(l=>l.id!==lid?l:
    {...l, vars:l.vars.map(v=>v.id===vid?{...v, ...(typeof patch==='function'?patch(v):patch)}:v)}));

  const addLine = (brand, name) => {
    if(!name || !name.trim()) return;
    const nl = {...emptyLine(brand), name:name.trim()};
    setLines(ls=>[...ls, nl]);
    setView({page:'line', lineId:nl.id});
  };
  const renameLine = (l, name) => {
    if(name && name.trim()) patchLine(l.id,{name:name.trim()});
  };
  const deleteLine = l => {
    setLines(ls=>ls.filter(x=>x.id!==l.id));
    setView({page:'lines', brand:l.brand});
  };
  const addVar = lid => {
    const nv = emptyVar();
    setLines(ls=>ls.map(l=>l.id===lid?{...l, vars:[...l.vars, nv]}:l));
    setView({page:'variation', lineId:lid, varId:nv.id, isNew:true});
  };
  const cancelVar = () => {
    if(view.isNew){
      setLines(ls=>ls.map(l=>l.id!==view.lineId?l:{...l, vars:l.vars.filter(v=>v.id!==view.varId)}));
    }
    setView({page:'line', lineId:view.lineId});
  };
  const deleteVar = (lid,vid) => {
    setLines(ls=>ls.map(l=>l.id===lid?{...l, vars:l.vars.filter(v=>v.id!==vid)}:l));
    setView({page:'line', lineId:lid});
  };

  let title='ブランドを選ぶ', crumb='', back=null;
  if(view.page==='lines'){ title=view.brand; crumb='ライン一覧'; back=()=>setView({page:'brands'}); }
  if(view.page==='line' && line){ title=line.name; crumb=line.brand; back=()=>setView({page:'lines',brand:line.brand}); }
  if(view.page==='variation' && line){ title=line.name; crumb=line.brand+' › バリエーション'; back=cancelVar; }

  if((view.page==='line'||view.page==='variation') && !line){
    return <div className="empty"><h3>表示できません</h3><button className="btn bsec" onClick={()=>setView({page:'brands'})}>最初に戻る</button></div>;
  }

  return (
    <div className="app">
      <div className="topbar">
        {back && <button className="backbtn" onClick={back}>←</button>}
        <div style={{minWidth:0}}>
          <h1>{title}</h1>
          {crumb && <div className="crumb">{crumb}</div>}
        </div>
      </div>
      <div className="main">
        {view.page==='brands' && <>
          <div className="bgrid">
            {BRANDS.map(b=>(
              <div key={b} className="bcard" onClick={()=>setView({page:'lines',brand:b})}>
                <div className="bname">{b}</div>
                <div className="bcount">{linesOf(b).length}ライン</div>
              </div>
            ))}
          </div>
          <BackupBar lines={lines} onReplace={setLines} />
        </>}

        {view.page==='lines' && <>
          <div className="lgrid">
            {linesOf(view.brand).map(l=>{
              const cov = coverOf(l.vars[0]||{});
              return (
                <div key={l.id} className="lcard" onClick={()=>setView({page:'line',lineId:l.id})}>
                  <div className="lthumb">{cov ? <img src={srcOf(cov)} alt="" /> : '写真なし'}</div>
                  <div style={{minWidth:0}}>
                    <div className="lname">{l.name}</div>
                    <div className="lmeta">{l.vars.length}バリエーション{l.common?' ・共通情報あり':''}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <AddLineForm onAdd={name=>addLine(view.brand,name)} />
        </>}

        {view.page==='line' &&
          <LinePage line={line}
            onCommon={t=>patchLine(line.id,{common:t})}
            onOpen={v=>setView({page:'variation',lineId:line.id,varId:v.id})}
            onAdd={()=>addVar(line.id)}
            onRename={name=>renameLine(line,name)}
            onDeleteLine={()=>deleteLine(line)} />}

        {view.page==='variation' &&
          <VarPage key={vari.id} v={vari}
            onSave={draft=>{ patchVar(line.id,vari.id,draft); setView({page:'line',lineId:line.id}); }}
            onCancel={cancelVar}
            onDelete={()=>deleteVar(line.id,vari.id)} />}
      </div>
    </div>
  );
}

/* ══════════ 小さな部品 ══════════ */
function AddLineForm({onAdd}){
  const [open,setOpen] = useState(false);
  const [name,setName] = useState('');
  const submit = () => { if(name.trim()){ onAdd(name); setName(''); setOpen(false); } };
  if(!open) return <div className="addline" style={{marginTop:10}} onClick={()=>setOpen(true)}>＋ ラインを追加</div>;
  return (
    <div className="inlineform">
      <input type="text" value={name} autoFocus placeholder="ライン名（例：1500L、Hウォッチ）"
        onChange={e=>setName(e.target.value)}
        onKeyDown={e=>{ if(e.key==='Enter') submit(); }} />
      <div className="inlinebtns">
        <button className="btn bsec" onClick={()=>{setOpen(false);setName('');}}>キャンセル</button>
        <button className="btn bprim" onClick={submit} disabled={!name.trim()}>追加</button>
      </div>
    </div>
  );
}

function ConfirmBtn({label, confirmLabel, onConfirm}){
  const [armed,setArmed] = useState(false);
  useEffect(()=>{ if(!armed) return; const t=setTimeout(()=>setArmed(false),4000); return ()=>clearTimeout(t); },[armed]);
  return <button className={'btn '+(armed?'bdangeron':'bdanger')}
    onClick={()=>{ if(armed){ onConfirm(); } else { setArmed(true); } }}>
    {armed ? (confirmLabel||'本当に削除する') : label}
  </button>;
}

/* ══════════ ライン詳細 ══════════ */
function LinePage({line,onCommon,onOpen,onAdd,onRename,onDeleteLine}){
  const [edit,setEdit] = useState(false);
  const [ren,setRen] = useState(false);
  const [name,setName] = useState(line.name);
  return (<>
    {ren
      ? <div className="inlineform" style={{marginBottom:14}}>
          <input type="text" value={name} autoFocus onChange={e=>setName(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter'){ onRename(name); setRen(false); } }} />
          <div className="inlinebtns">
            <button className="btn bsec" onClick={()=>{setName(line.name);setRen(false);}}>キャンセル</button>
            <button className="btn bprim" onClick={()=>{onRename(name);setRen(false);}} disabled={!name.trim()}>変更</button>
          </div>
        </div>
      : null}

    <div className="commonbox">
      <button className="commonedit" onClick={()=>setEdit(!edit)}>{edit?'完了':'編集'}</button>
      <h3>共通情報</h3>
      {edit
        ? <textarea rows={7} value={line.common} onChange={e=>onCommon(e.target.value)}
            placeholder="性別・型番の調べ方・必須条件など、このラインに共通することを自由に書く" autoFocus/>
        : (line.common
            ? <div className="ctext">{line.common}</div>
            : <div className="cempty">まだ何も書かれていません。「編集」から追加できます。</div>)}
    </div>

    <div className="vgrid">
      {line.vars.map(v=>{
        const cov = coverOf(v);
        return (
          <div key={v.id} className={'vcard'+(v.ng?' isng':'')} onClick={()=>onOpen(v)}>
            <div className="vimg">{cov ? <img src={srcOf(cov)} alt="" /> : '写真なし'}</div>
            {v.ng && <div className="vng">NG</div>}
            <div className="vfoot">
              <div className="vlabel">{v.label||''}</div>
              <div className="vprices">
                {(v.ceilingExc || v.ceilingNM) ? <>
                  <div className="prow"><span className="pcond">Exc+5</span><span className="pval">{v.ceilingExc?yen(v.ceilingExc):'—'}</span></div>
                  <div className="prow"><span className="pcond">NearMINT</span><span className="pval">{v.ceilingNM?yen(v.ceilingNM):'—'}</span></div>
                </> : <div className="pnone">上限未入力</div>}
              </div>
            </div>
          </div>
        );
      })}
      <div className="addcard" onClick={onAdd}>＋ 追加</div>
    </div>

    <div className="dfoot">
      <ConfirmBtn label="ラインを削除" confirmLabel="バリエーションごと削除する" onConfirm={onDeleteLine} />
      <button className="btn bsec" onClick={()=>{setName(line.name);setRen(true);}}>ライン名を変更</button>
    </div>
  </>);
}

/* ══════════ バリエーション詳細 ══════════ */
function VarPage({v,onSave,onCancel,onDelete}){
  const [d,setD] = useState(v);
  const [sel,setSel] = useState(0);
  const [drag,setDrag] = useState(false);
  const fileRef = useRef(null);
  const onChange = patch => setD(prev=>({...prev, ...(typeof patch==='function'?patch(prev):patch)}));
  const set = k => e => onChange({[k]:e.target.value});
  const photos = d.photos || [];
  const dirty = JSON.stringify(d) !== JSON.stringify(v);
  const uploading = photos.some(p=>p.uploading);
  const shown = photos[Math.min(sel, Math.max(photos.length-1,0))] || null;

  const handleFiles = files => {
    Array.from(files).forEach(file=>{
      const reader = new FileReader();
      reader.onload = () => {
        const pid = uid('p');
        onChange(prev=>({ photos:[...(prev.photos||[]), {id:pid, url:reader.result, cloudinaryUrl:null, uploading:true}] }));
        uploadToCloudinary(reader.result).then(url=>{
          onChange(prev=>({ photos:(prev.photos||[]).map(p=>p.id===pid?{...p, url:url, cloudinaryUrl:url, uploading:false}:p) }));
        }).catch(()=>{
          onChange(prev=>({ photos:(prev.photos||[]).map(p=>p.id===pid?{...p, uploading:false, error:true}:p) }));
        });
      };
      reader.readAsDataURL(file);
    });
  };

  return (
    <div className="dbody">
      <div className="dphoto">
        <div className="mainphoto">{shown ? <img src={srcOf(shown)} alt="" /> : <span>写真なし</span>}</div>
        {photos.length>0 &&
          <div className="thumbstrip">
            {photos.map((p,i)=>(
              <div key={p.id} className={'tsimg'+(i===sel?' active':'')} onClick={()=>setSel(i)}>
                <img src={srcOf(p)} alt="" />
                {p.uploading && <span className="spin" style={{position:'absolute',bottom:4,left:4}}></span>}
                <button className="rm" onClick={e=>{e.stopPropagation();
                  onChange(prev=>({photos:(prev.photos||[]).filter(x=>x.id!==p.id)})); setSel(0);}}>×</button>
              </div>
            ))}
          </div>}
        <div className={'dz'+(drag?' drag':'')}
          onClick={()=>fileRef.current.click()}
          onDragOver={e=>{e.preventDefault();setDrag(true);}}
          onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);handleFiles(e.dataTransfer.files);}}>
          ＋ 写真を追加（1枚目が一覧の表紙になります）
        </div>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}}
          onChange={e=>{handleFiles(e.target.files); e.target.value='';}} />

        <div className="ceilingbox">
          <div className="clabel">仕入上限</div>
          <div className="ceilingrow">
            <span className="ccond">Exc+5</span>
            <span className="yen">¥</span>
            <input inputMode="numeric" value={d.ceilingExc||''} placeholder="0"
              onChange={e=>onChange({ceilingExc:digitsOnly(e.target.value)})}/>
          </div>
          <div className="ceilingrow">
            <span className="ccond">Near MINT</span>
            <span className="yen">¥</span>
            <input inputMode="numeric" value={d.ceilingNM||''} placeholder="0"
              onChange={e=>onChange({ceilingNM:digitsOnly(e.target.value)})}/>
          </div>
        </div>
      </div>

      <div className="dform">
        <label>呼び名（一覧に表示されます）</label>
        <input type="text" value={d.label||''} onChange={set('label')} placeholder="金×黒、チェンジベゼル など短く"/>

        <label>ヤフオク検索URL</label>
        <div className="linkrow">
          <input type="text" value={d.yahoo||''} onChange={set('yahoo')} placeholder="検索結果のURLを貼り付け"/>
          <a className={'linkbtn'+(d.yahoo?'':' off')} href={d.yahoo||'#'} target="_blank" rel="noreferrer">開く</a>
        </div>

        <label>eBay検索URL</label>
        <div className="linkrow">
          <input type="text" value={d.ebay||''} onChange={set('ebay')} placeholder="Sold絞り込み後のURLを貼り付け"/>
          <a className={'linkbtn'+(d.ebay?'':' off')} href={d.ebay||'#'} target="_blank" rel="noreferrer">開く</a>
        </div>

        <label><img className="fieldicon" src={ICON_CASE} alt="" />ケース（素材・形状・仕上げ）</label>
        <input type="text" value={d.caseNote||''} onChange={set('caseNote')} placeholder="ゴールドメッキ、丸型"/>

        <label><img className="fieldicon" src={ICON_DIAL} alt="" />ダイアル</label>
        <input type="text" value={d.dial||''} onChange={set('dial')} placeholder="ブラック"/>

        <label><img className="fieldicon" src={ICON_BELT} alt="" />ベルト</label>
        <input type="text" value={d.belt||''} onChange={set('belt')} placeholder="純正ブレス（社外品NG）"/>

        <label><img className="fieldicon" src={ICON_BEZEL} alt="" />ベゼル</label>
        <input type="text" value={d.bezel||''} onChange={set('bezel')} placeholder="交換式（12色）"/>

        <label>価格メモ（自由記述）</label>
        <input type="text" value={d.priceMemo||''} onChange={set('priceMemo')} placeholder="相場 ¥48,000 / 箱付きなら+1万"/>

        <label>備考</label>
        <textarea rows={4} value={d.notes||''} onChange={set('notes')} placeholder="チェンジベゼルなので単色での仕入れは絶対しない、など"/>

        <div className={'ngcheck'+(d.ng?' on':'')} onClick={()=>onChange({ng:!d.ng})}>
          <input type="checkbox" checked={!!d.ng} readOnly/>似てるけど買わない（NG例）
        </div>

        <div className="dfoot">
          <ConfirmBtn label="削除" onConfirm={onDelete} />
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            {uploading && <span className="upnote">写真アップロード中…</span>}
            <button className="btn bsec" onClick={onCancel}>キャンセル</button>
            <button className="btn bprim" onClick={()=>onSave(d)} disabled={uploading}>登録</button>
          </div>
        </div>
        {dirty && !uploading && <div className="dirtynote">未登録の変更があります。「登録」を押すと保存されます。</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
