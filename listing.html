<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eBay 出品アプリ</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surf:#161b24;--surf2:#1e2535;--bdr:#2a3348;
      --txt:#e4e8f4;--mut:#6e7a9e;
      --acc:#f5a623;--acc-lo:rgba(245,166,35,.12);
      --blu:#4f8ef7;--blu-lo:rgba(79,142,247,.1);
      --grn:#3fb950;--red:#f87171;
      --jp:'Noto Sans JP',sans-serif;
      --ui:'DM Sans',var(--jp),sans-serif;
      --mono:'DM Mono',monospace;
    }
    html,body,#root{height:100%;overflow:hidden;width:100%}
    body{background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:14px}
    #root{display:flex}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

    /* ── Form panel ── */
    .fpanel{flex:1.1;min-width:380px;display:flex;flex-direction:column;border-right:1px solid var(--bdr)}
    .fpanel-header{padding:9px 18px;border-bottom:1px solid var(--bdr);background:var(--surf);display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:40px}
    .fhtxt{font-size:13px;font-weight:600;color:var(--acc);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fcontent{flex:1;overflow-y:auto;padding:16px}

    /* ── Right panel (output) ── */
    .rpanel{flex:1;min-width:400px;display:flex;flex-direction:column;background:var(--bg)}
    .rtabs{display:flex;border-bottom:1px solid var(--bdr);background:var(--surf);flex-shrink:0;padding:0 12px}
    .rtab{padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--mut);transition:all .15s;white-space:nowrap;user-select:none}
    .rtab:hover{color:var(--txt)}
    .rtab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
    .rcontent{flex:1;overflow-y:auto;padding:16px}

    /* ── Form sections ── */
    .sec{background:var(--surf);border:1px solid var(--bdr);border-radius:9px;padding:14px;margin-bottom:12px}
    .sttl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:10px}

    label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;margin-top:10px}
    label:first-of-type{margin-top:0}
    input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:6px;color:var(--txt);font-family:var(--ui);font-size:13px;padding:6px 10px;outline:none;transition:border-color .15s}
    input[type=text]:focus,textarea:focus,select:focus{border-color:var(--acc)}
    input[type=text][readonly]{background:var(--surf2);color:var(--mut);cursor:not-allowed}
    select option{background:var(--surf2)}
    textarea{resize:vertical;min-height:60px}

    /* type grid */
    .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
    .tbtn{padding:7px 4px;border:1px solid var(--bdr);border-radius:6px;text-align:center;cursor:pointer;font-size:11px;color:var(--mut);transition:all .12s;background:var(--bg);user-select:none}
    .tbtn:hover{border-color:var(--acc)}
    .tbtn.on{border-color:var(--acc);background:var(--acc-lo);color:var(--acc);font-weight:700}

    /* condition */
    .cwrap{display:flex;flex-wrap:wrap;gap:4px}
    .cbtn{padding:4px 10px;border:1px solid var(--bdr);border-radius:5px;cursor:pointer;font-size:12px;color:var(--mut);transition:all .12s;background:var(--bg);user-select:none;white-space:nowrap}
    .cbtn:hover{border-color:var(--acc)}
    .cbtn.on{border-color:var(--acc);background:var(--acc-lo);color:var(--acc);font-weight:700}

    /* optics */
    .opbox{border:1px solid var(--bdr);border-radius:7px;padding:11px;margin-bottom:8px;background:var(--bg)}
    .opbtl{font-size:11px;font-weight:700;color:var(--txt);margin-bottom:8px}
    .overall-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
    .ovbtn{padding:3px 9px;border:1px solid var(--bdr);border-radius:4px;font-size:11px;cursor:pointer;background:var(--surf);color:var(--mut);transition:all .1s;user-select:none;white-space:nowrap}
    .ovbtn.on{border-color:var(--acc);background:var(--acc-lo);color:var(--acc);font-weight:600}
    .oprow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
    .oplbl{width:90px;font-size:11px;color:var(--mut);flex-shrink:0}
    .tg{display:flex;gap:3px;flex-shrink:0}
    .tgbtn{padding:3px 8px;border:1px solid var(--bdr);border-radius:4px;font-size:11px;cursor:pointer;background:var(--surf);color:var(--mut);transition:all .1s;user-select:none}
    .tgbtn.nn.on{border-color:var(--grn);background:rgba(63,185,80,.1);color:var(--grn)}
    .tgbtn.pp.on{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red)}
    .opni{flex:1;font-size:11px;padding:3px 7px;min-width:0}
    .extra-list{margin-top:8px;display:flex;flex-direction:column;gap:8px}
    .extra-card{border:1px solid var(--bdr);border-radius:7px;background:var(--bg);padding:8px}
    .extra-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
    .extra-head textarea{flex:1;min-height:46px}
    .xbtn{width:28px;height:28px;border:1px solid var(--bdr);border-radius:5px;background:var(--surf);color:var(--mut);cursor:pointer;flex-shrink:0}
    .xbtn:hover{border-color:var(--red);color:var(--red)}

    /* bundles */
    .bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
    .bi{display:flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--bdr);border-radius:6px;cursor:pointer;background:var(--bg);transition:all .12s;user-select:none}
    .bi:hover{border-color:var(--blu)}
    .bi.on{border-color:var(--blu);background:var(--blu-lo)}
    .bi input{accent-color:var(--blu);width:12px;height:12px;pointer-events:none}
    .bilbl{font-size:12px}

    /* buttons */
    .btn{padding:8px 14px;border-radius:6px;border:none;cursor:pointer;font-family:var(--ui);font-size:13px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
    .btn:disabled{opacity:.5;pointer-events:none}
    .bprim{background:var(--acc);color:#000}.bprim:hover{background:#e69520}
    .bsec{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr)}.bsec:hover{border-color:var(--acc)}
    .bblu{background:var(--blu);color:#fff}.bblu:hover{background:#3a7de0}
    .bsm{padding:5px 10px;font-size:12px}
    .bfull{width:100%;justify-content:center}

    /* html output */
    .hout{background:var(--bg);border:1px solid var(--bdr);border-radius:7px;padding:12px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--mut);overflow:auto;white-space:pre-wrap;word-break:break-all;flex:1;min-height:0}
    .html-area{display:flex;flex-direction:column;height:calc(100vh - 160px);gap:10px;padding-bottom:10px}

    /* photos */
    .dz{border:2px dashed var(--bdr);border-radius:9px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s}
    .dz:hover,.dz.drag{border-color:var(--acc);background:var(--acc-lo)}
    .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
    .pthumb{position:relative;border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--bg);border:1px solid var(--bdr)}
    .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
    .pctrl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.78);padding:4px;display:flex;gap:3px;justify-content:center}
    .pidx{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:1px 4px;border-radius:3px;font-family:var(--mono)}
    .done-badge{position:absolute;top:4px;right:4px;background:var(--grn);color:#000;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px}

    /* misc */
    .empty{text-align:center;padding:36px 16px;color:var(--mut)}
    .empty h3{color:var(--txt);font-size:13px;margin-bottom:5px}
    .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:sp .6s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .ok{color:var(--grn);font-size:12px}
    .aapp{font-size:11px;color:var(--mut);padding:6px 9px;background:var(--bg);border-radius:5px;border:1px solid var(--bdr);margin-bottom:7px}
    .rfbtn{background:none;border:1px solid var(--bdr);color:var(--mut);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:11px;transition:all .12s}
    .rfbtn:hover{border-color:var(--acc);color:var(--acc)}
    .frow{display:flex;gap:5px;margin-bottom:8px}
    .fopt{padding:5px 11px;border:1px solid var(--bdr);border-radius:5px;cursor:pointer;font-size:12px;color:var(--mut);transition:all .12s;background:var(--bg);user-select:none}
    .fopt.on{border-color:var(--acc);background:var(--acc-lo);color:var(--acc);font-weight:600}
    .chklist{display:flex;flex-wrap:wrap;gap:5px}
    .chkbtn{padding:4px 10px;border:1px solid var(--bdr);border-radius:5px;cursor:pointer;font-size:12px;color:var(--mut);transition:all .12s;background:var(--bg);user-select:none;display:flex;align-items:center;gap:5px}
    .chkbtn:hover{border-color:var(--blu)}
    .chkbtn.on{border-color:var(--blu);background:var(--blu-lo);color:var(--blu);font-weight:600}
    .chkbtn .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0}
    .chkbtn.on .dot{background:var(--blu)}
    .input-label{font-size:11px;color:var(--mut);margin-bottom:5px;margin-top:9px}
    .sn-wrap{display:flex;flex-direction:column;gap:6px}
    .sn-toggle-row{display:flex;gap:5px}
    .sntgl{padding:4px 10px;border:1px solid var(--bdr);border-radius:5px;cursor:pointer;font-size:12px;color:var(--mut);transition:all .12s;background:var(--bg);user-select:none}
    .sntgl:hover{border-color:var(--blu)}
    .sntgl.on{border-color:var(--blu);background:var(--blu-lo);color:var(--blu);font-weight:600}
    .sn-input-row{display:flex;gap:6px;align-items:center;padding-top:4px}
    .sn-input-row .prefix{font-size:12px;color:var(--acc);font-weight:700;font-family:var(--mono);white-space:nowrap}
    .title-cands{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;flex-shrink:0}
    .cand{background:var(--surf);border:1px solid var(--bdr);border-radius:7px;padding:10px;transition:all .15s}
    .cand:hover{border-color:var(--acc);background:var(--surf2)}
    .cand-num{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:6px;display:flex;align-items:center;gap:6px}
    .cand-title{font-size:12px;font-weight:600;color:var(--txt);line-height:1.5;font-family:var(--mono);word-break:break-all}
    .cand-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
    .cand-chars{font-size:11px;font-family:var(--mono);color:var(--grn)}
    .cand-chars.over{color:var(--red)}
    .final-title-box{display:flex;gap:8px;align-items:center;margin-top:2px}
    .final-title-box input{flex:1;min-width:0}
    .spec-input-wrap{position:relative}
    .spec-input-wrap input{padding-right:34px}
    .spec-copy-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:1px solid var(--bdr);border-radius:5px;background:var(--surf2);color:var(--mut);font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .spec-copy-btn:hover{border-color:var(--blu);color:var(--blu)}
    .spec-copy-btn.done{border-color:var(--grn);color:var(--grn);background:rgba(63,185,80,.1)}
    .title-copy-status{width:34px;min-width:34px;padding-left:0!important;padding-right:0!important}
    .genbar{position:sticky;bottom:0;padding:12px 16px 22px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;justify-content:flex-end;gap:8px;align-items:center;margin:0 -16px}
    .note{font-size:11px;color:var(--mut);margin-top:6px;text-align:center}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;


const TYPES = ['Film Camera','Digital Camera','Movie Camera','Camcorder','Lens','Binoculars'];
const CONDITIONS = ['Top MINT','MINT','Near MINT','Exc+5','Exc+4','Exc+3','AS-IS / For parts or repair'];
const SPECIALS = ['READ','All Works','Meter Works','Rare'];
const WITH_ITEMS = ['Hood','Case','Box','Strap'];

const HAS_FINDER = new Set(['Film Camera','Digital Camera','Movie Camera','Camcorder']);
const OP_ITEMS = ['Fungus','Haze','Scratch','Dust'];
const OVERALL_OPTS = [
  {val:'auto',  lbl:'自動'},
  {val:'very',  lbl:'Very beautiful'},
  {val:'beautiful',lbl:'Beautiful'},
  {val:'good',  lbl:'Good Condition.'},
  {val:'none',  lbl:'なし'},
];
const OVERALL_TEXT = {very:'Very beautiful condition.',beautiful:'Beautiful condition.',good:'Good Condition.',none:null};

const BUNDLE_LIST = [
  'Box','Case','Strap','Lens Hood','Lens Filter',
  'Front Lens Cap','Rear Lens Cap','Body Cap',
  'Battery','Battery Charger','Remote Control',
  'Manual','Mini-Tripod','CD','USB Cable',
  'AV Cable','S-Video Cable','AC Adapter',
  'HDMI Cable','Mini HDMI Cable','Micro HDMI Cable'
];

const API_KEY_STORAGE_KEY = 'anthropic_api_key';
const ITEM_SPEC_FIELDS = {
  'Film Camera':    ['Brand','Type','Model','Format','Color','Focus Type','Series','Features','Country of Origin','Year Manufactured'],
  'Digital Camera': ['Brand','Type','Model','Series','Color','Optical Zoom','Features','Maximum Resolution','Battery Type','Digital Zoom','Maximum Aperture','Charger Included','Device Charging Range','Screen Size','Country of Origin','Connectivity'],
  'Movie Camera':   ['Brand','Film Format','Type','Color','Model','Country of Origin'],
  'Camcorder':      ['Brand','Type','Model','Features','Color','Media Format','Recording Definition','Optical Zoom','Digital Zoom','Series','Screen Size','Storage Type','Country of Origin','Connectivity'],
  'Lens':           ['Brand','Focal Length','Type','Focus Type','Maximum Aperture','Mount','Series','Compatible Filter Size','Compatible Lens Front','Compatible Brand','Model','Exterior Material','Country of Origin','Year Manufactured'],
  'Binoculars':     ['Brand','Type','Maximum Magnification','Application','Features','Size','Objective Lens Diameter','Model','Country of Origin','Color','Optical Design','Lens Coating'],
};

const ITEM_SPEC_FIXED_VALUES = {
  'UPC': 'N/A',
  'MPN': 'Does Not Apply',
  'Unit Quantity': '1',
  'Unit Type': 'Unit',
  'Item Weight': 'N/A',
  'Item Height': 'N/A',
  'Item Length': 'N/A',
  'Item Width': 'N/A',
  'Manufacturer Warranty': 'None',
  'California Prop 65 Warning': '',
};

const AI_SPEC_KEYS = new Set(Object.values(ITEM_SPEC_FIELDS).flat());
const itemSpecEntry = key => ({ key, kind: AI_SPEC_KEYS.has(key) ? 'AI' : 'FIXED' });
const ITEM_SPEC_ORDER = {
  'Film Camera': [
    'Brand','Type','Model','UPC','Format','Color','Focus Type','Series','Features','MPN',
    'Unit Quantity','Unit Type','Country of Origin','Year Manufactured','Manufacturer Warranty',
    'Item Weight','California Prop 65 Warning','Item Height','Item Length','Item Width',
  ].map(itemSpecEntry),
  'Digital Camera': [
    'Brand','Type','Model','UPC','Series','Color','Optical Zoom','Features','Maximum Resolution',
    'Battery Type','Digital Zoom','Maximum Aperture','MPN','Unit Quantity','Unit Type',
    'Charger Included','Device Charging Range','Screen Size','Country of Origin','Connectivity',
    'Manufacturer Warranty','Item Weight','California Prop 65 Warning','Item Height','Item Length','Item Width',
  ].map(itemSpecEntry),
  'Movie Camera': [
    'UPC','Brand','Film Format','Type','Color','Model','Country of Origin','California Prop 65 Warning',
  ].map(itemSpecEntry),
  'Camcorder': [
    'Brand','Type','Model','UPC','Features','Color','Media Format','Recording Definition','Optical Zoom',
    'Digital Zoom','Unit Quantity','Unit Type','Series','Screen Size','Storage Type','Country of Origin',
    'Connectivity','Manufacturer Warranty','California Prop 65 Warning','MPN',
  ].map(itemSpecEntry),
  'Lens': [
    'Brand','Focal Length','Type','Focus Type','Maximum Aperture','Mount','UPC','Series',
    'Compatible Filter Size','Compatible Lens Front','Compatible Brand','Model','Exterior Material',
    'MPN','Unit Quantity','Unit Type','Country of Origin','Year Manufactured','Manufacturer Warranty',
    'California Prop 65 Warning','Item Height','Item Length','Item Weight','Item Width',
  ].map(itemSpecEntry),
  'Binoculars': [
    'Brand','Type','Maximum Magnification','UPC','Application','Features','Size',
    'Objective Lens Diameter','Model','MPN','Unit Quantity','Unit Type','Country of Origin','Color',
    'Optical Design','Lens Coating','Manufacturer Warranty','Item Weight','California Prop 65 Warning',
    'Item Height','Item Length','Item Width',
  ].map(itemSpecEntry),
};

const getItemSpecEntries = type =>
  ITEM_SPEC_ORDER[type] || (ITEM_SPEC_FIELDS[type] || []).map(key => ({ key, kind:'AI' }));

const initOp = () => ({
  fungus:'none',fungusNote:'',haze:'none',hazeNote:'',
  scratch:'none',scratchNote:'',dust:'none',dustNote:'',
  balsam:'none',balsamNote:'',
  overall:'auto',
});

// ── HTML Generation ──
function buildOpSection(op, type, showBalsam, extra) {
  const isLens = type==='lens';
  const label = isLens?'Lens':'Finder';
  const summary = isLens?'No problem in the shooting.':'No problem in the view.';

  // Determine overall text
  let overallTxt = null;
  if(op.overall==='auto') {
    const hasIssue = op.fungus==='present'||op.haze==='present'||op.scratch==='present'||(showBalsam&&op.balsam==='present');
    const hasDust = op.dust==='present';
    if(!hasIssue&&!hasDust) overallTxt='Very beautiful condition.';
    else if(!hasIssue&&hasDust) overallTxt='Beautiful condition.';
  } else {
    overallTxt = OVERALL_TEXT[op.overall] ?? null;
  }

  const line = (val,noTxt,yesDef,note) =>
    (val==='none' ? noTxt : (note.trim()||yesDef)) + '<br>\n';

  let h = `<div>-${label} </div>\n`;
  if(overallTxt) h += `<div><b style="color:rgb(255,0,16);">${overallTxt}</b></div>\n`;
  h += line(op.fungus,'There is no fungus.','There is fungus.',op.fungusNote);
  h += line(op.haze,'There is no haze.','There is haze.',op.hazeNote);
  h += line(op.scratch,'There is no scratch.','There is a scratch.',op.scratchNote);
  h += line(op.dust,'There is no dust.','There is a little dust.',op.dustNote);
  if(showBalsam) h += line(op.balsam,'There is no balsam separation.','There is balsam separation.',op.balsamNote);
  if(extra && extra.trim()) h += extra.trim() + '<br>\n';
  h += `<strong>${summary}</strong>`;
  return h;
}

function genHTML(d) {
  const {title,pType,cond,serialBody,serialLens,hasLensSerial,appChoice,lensOp,finOp,funcDef,funcCus,lensExtras=[],finExtras=[],funcExtras=[],bundles} = d;
  const extrasHtml = extras => extras.filter(x=>x.en.trim()).map(x=>x.en.trim()).join('<br>\n');
  const htmlConditionMap = {
    "Exc+5": "EXCELLENT+++++",
    "Exc+4": "EXCELLENT++++",
    "Exc+3": "EXCELLENT+++",
  };
  const htmlCondition = htmlConditionMap[cond] || cond;
  const serialTxt = hasLensSerial
    ? `Body:${serialBody||'—'}<br>\n&nbsp; &nbsp; Lens:${serialLens||'—'}`
    : `Body:${serialBody||'—'}`;

  let appH = '';
  if(appChoice==='beautiful') appH = '<div><b><span style="color:rgb(255,0,16);">Appearance is beautiful.</span></b></div>\n<div>* Please check photos.</div>';
  else if(appChoice==='scuffs') appH = '<div>Tiny scuffs from normal use.</div>\n<div>* Please check photos.</div>';
  else appH = '<div>It shows signs of use.</div>\n<div>* Please check photos.</div>';

  let opH = buildOpSection(lensOp,'lens',true,extrasHtml(lensExtras));
  if(HAS_FINDER.has(pType)) {
    opH += `\n</section><section class="product_dec">\n` + buildOpSection(finOp,'finder',true,extrasHtml(finExtras));
  }

  const funcTxt = funcDef?'It works properly.':(funcCus.trim()||'It works properly.');
  const funcExtra = extrasHtml(funcExtras);
  const funcTxtFull = funcExtra ? funcTxt + '<br>\n' + funcExtra : funcTxt;
  const bH = bundles.length ? bundles.map(i=>`-${i}`).join('<br>\n') : '-None';
  const ttl = title||'[CONDITION] Item Name From JAPAN';

  return `<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

async function uploadToCloudinary(base64) {
  const blob = await fetch(base64).then(r => r.blob());
  const fd = new FormData();
  fd.append('file', blob, 'photo.jpg');
  fd.append('upload_preset', 'ebay-calc');
  const res = await fetch('https://api.cloudinary.com/v1_1/dlsmimq4x/image/upload', {
    method: 'POST', body: fd
  });
  if (!res.ok) throw new Error('Cloudinary upload failed: ' + res.status);
  const data = await res.json();
  return data.secure_url;
}

function buildTitleAuto({cond, specials, withItems, color, snType, snValue, brand, model}) {
  const makeTitle = ({keepFrom=true, compactF=false, keepColor=true, keepItems=true, keepSn=true}={}) => {
    const condition = keepItems && withItems.length
      ? `[${cond} w/ ${withItems.join(', ')}]`
      : `[${cond}]`;
    const sn = keepSn && snType && snValue.trim() ? `${snType} ${snValue.trim()}` : '';
    const parts = [
      specials.length ? specials.join(' ') : '',
      condition,
      brand.trim(),
      model.trim(),
      keepColor ? color.trim() : '',
      sn,
      keepFrom ? 'From JAPAN' : 'JAPAN'
    ].filter(Boolean);
    const title = parts.join(' ').replace(/\s+/g,' ').trim();
    return compactF ? title.replace(/\bf\/(?=\d)/gi,'f') : title;
  };

  const steps = [
    {},
    {keepFrom:false},
    {keepFrom:false, compactF:true},
    {keepFrom:false, compactF:true, keepColor:false},
    {keepFrom:false, compactF:true, keepColor:false, keepItems:false},
    {keepFrom:false, compactF:true, keepColor:false, keepItems:false, keepSn:false}
  ];
  for(const opts of steps) {
    const title = makeTitle(opts);
    if(title.length <= 80) return title;
  }
  return makeTitle(steps[steps.length - 1]);
}

function highlightTitle(title) {
  const parts = [];
  let rest = title;
  const specMatch = rest.match(/^(READ!?|All Works|Meter Works|Rare)\s+/);
  if(specMatch) {
    parts.push(<span key="sp" style={{color:'var(--red)'}}>{specMatch[0]}</span>);
    rest = rest.slice(specMatch[0].length);
  }
  const condMatch = rest.match(/^\[.*?\]/);
  if(condMatch) {
    parts.push(<span key="cd" style={{color:'var(--acc)'}}>{condMatch[0]}</span>);
    rest = rest.slice(condMatch[0].length);
  }
  parts.push(<span key="rest">{rest}</span>);
  return parts;
}

function OpBox({title,op,setOp,showBalsam}) {
  const items=[...OP_ITEMS,...(showBalsam?['Balsam']:[])];
  const set=(f,v)=>setOp(p=>({...p,[f]:v}));
  return (
    <div className="opbox">
      <div className="opbtl">— {title}</div>
      <div className="overall-row">
        {OVERALL_OPTS.map(o=>(
          <button key={o.val} className={`ovbtn ${op.overall===o.val?'on':''}`} onClick={()=>set('overall',o.val)}>{o.lbl}</button>
        ))}
      </div>
      {items.map(item=>{
        const k=item.toLowerCase();
        return (
          <div key={item} className="oprow">
            <div className="oplbl">{item}</div>
            <div className="tg">
              <button className={`tgbtn nn ${op[k]==='none'?'on':''}`} onClick={()=>set(k,'none')}>なし</button>
              <button className={`tgbtn pp ${op[k]==='present'?'on':''}`} onClick={()=>set(k,'present')}>あり</button>
            </div>
            <input type="text" className="opni"
              placeholder={op[k]==='present'?'補足（任意）':''}
              value={op[k+'Note']||''}
              disabled={op[k]==='none'}
              style={{opacity:op[k]==='present'?1:0.3}}
              onChange={e=>set(k+'Note',e.target.value)}
            />
          </div>
        );
      })}
    </div>
  );
}

    const inputs = extras.map((x,i)=>x.jp.trim() ? `Extra ${i+1}: ${x.jp.trim()}` : '').filter(Boolean);
    const chatText = `あなたはeBayでカメラ・レンズを日本から海外に販売するセラーのアシスタントです。
以下の日本語の状態説明を、それぞれeBayバイヤー向けの自然な英語1文に変換してください。
各項目を以下の形式で出力してください。コピペしやすいよう項目ごとに改行で区切ること。

【Functional】
[項目名]: [英文]

出力例：
Extra 1: The self-timer does not work.

【日本語入力】
${inputs.length ? inputs.join('\n') : '（入力なし）'}`;
    openChatGPT(chatText);
  };

  const handleGenerate=async()=>{
    setGenBusy(true); setRtab('html');
    try{
      setHtml(genHTML({title:ebayTitle,pType,cond,serialBody,serialLens,hasLensSerial,appChoice,lensOp,finOp,funcDef,funcCus,lensExtras,finExtras,funcExtras,bundles}));
    }finally{setGenBusy(false);}
  };

  const handleCopy=()=>{
    navigator.clipboard.writeText(html).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});
  };

  const handleGenerateItemSpecifics=async()=>{
    setItemSpecBusy(true);
    setItemSpecError('');
    try{
      const specs=await generateItemSpecifics({pType,brand,model,cond,color,bundles,ebayTitle});
      setItemSpecifics(specs);
    }catch(e){
      setItemSpecError(e.message || 'Item Specifics generation failed.');
    }finally{
      setItemSpecBusy(false);
    }
  };

  const setItemSpecificValue=(key,value)=>setItemSpecifics(p=>({...p,[key]:value}));

  const handleVerifyFeatures = () => {
    const features = itemSpecifics['Features'] || '';
    const chatText = `あなたはカメラのスペックに詳しい専門家です。
以下のカメラのFeatures（機能）リストを実際のスペックと厳密に照合してください。
「このカメラが確実にこの機能を持っている」と言えるものだけを残し、少しでも不確かなものは削除してください。迷ったら削除を優先してください。

【カメラ】${ebayTitle}
【現在のFeatures】${features}

【eBayの選択肢リスト】
Auto Exposure, Built-in Flash, Built-In Light Meter, Date Imprint, Dioptric Adjustment, Electric Drive, Lomographic Camera, Manual Program Modes, Multiple Exposure, Panorama Setting, Red Eye Reduction, Scratch Resistant, Selfie Mirror, Shock-Proof, Shooting-Modes, Timer, UV Filter, Waterproof/Underwater

出力形式：
- 削除した項目とその理由を箇条書きで説明
- 追加すべき項目があれば理由と一緒に箇条書きで提案
- 最後に「【修正後のFeatures（コピペ用）】」という見出しをつけて、正しいFeaturesのみをカンマ区切りで1行で出力
- コピペ用の行はコードブロック（\`\`\`）で囲む`;
    window.open(`https://chatgpt.com/?q=${encodeURIComponent(chatText)}`, '_blank', 'noopener');
  };

  const copyItemSpecificValue=(key,value)=>{
    copyText(value || '').then(()=>{
      setCopiedSpecKey(key);
      setTimeout(()=>setCopiedSpecKey(p=>p===key?'':p),2000);
    });
  };

  const handleDownloadCsv = () => {
    const CATEGORY_ID = {
      'Film Camera':    '3115',
      'Digital Camera': '31388',
      'Movie Camera':   '11709',
      'Camcorder':      '11724',
      'Lens':           '3323',
      'Binoculars':     '28179',
    };

    const esc = v => {
      const s = String(v ?? '');
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };

    const aiFields = ITEM_SPEC_FIELDS[pType] || [];

    // eBay公式フォーマットのヘッダー（固定列）
    const fixedHeaders = [
      '*Action(SiteID=US|Country=US|Currency=USD|Version=1193)',
      'Custom Label (SKU)',
      'Category ID',
      'Category Name',
      'Title',
      'Relationship',
      'Relationship details',
      'Schedule Time',
      'P:UPC',
      'P:EPID',
      'Start price',
      'Quantity',
      'Item photo URL',
      'VideoID',
      'Condition ID',
      'Description',
      'Format',
      'Duration',
      'Buy It Now price',
      'Best Offer Enabled',
      'Best Offer Auto Accept Price',
      'Minimum Best Offer Price',
      'Immediate pay required',
      'Location',
      'Shipping profile name',
      'Return profile name',
      'Payment profile name',
    ];

    // Item SpecificsはC:プレフィックスをつける
    const specHeaders = aiFields.map(k => 'C:' + k);

    const headers = [...fixedHeaders, ...specHeaders];

    // 写真URLをパイプ区切りで結合（最大12枚）
    const picUrls = photos
      .map(p => p.cloudinaryUrl || '')
      .filter(u => u)
      .slice(0, 12)
      .join('|');

    // 固定列の値
    const fixedValues = [
      'Add',           // Action
      '',              // Custom Label (SKU)
      CATEGORY_ID[pType] || '',  // Category ID
      '',              // Category Name
      ebayTitle,       // Title
      '',              // Relationship
      '',              // Relationship details
      '',              // Schedule Time
      'N/A',           // P:UPC
      '',              // P:EPID
      '',              // Start price
      1,               // Quantity
      picUrls,         // Item photo URL（パイプ区切り）
      '',              // VideoID
      '3000',          // Condition ID（Used）
      html,            // Description
      'FixedPrice',    // Format
      'GTC',           // Duration
      '',              // Buy It Now price
      '',              // Best Offer Enabled
      '',              // Best Offer Auto Accept Price
      '',              // Minimum Best Offer Price
      '',              // Immediate pay required
      'Japan',         // Location
      '',              // Shipping profile name
      '',              // Return profile name
      '',              // Payment profile name
    ];

    // Item Specificsの値
    const specValues = aiFields.map(k => {
      const val = itemSpecifics[k] || '';
      // Features等の複数値項目はカンマ区切りをパイプ区切りに変換
      if (k === 'Features' || k === 'Connectivity') {
        return val.split(',').map(v => v.trim()).filter(Boolean).join('|');
      }
      return val;
    });

    const row = [...fixedValues, ...specValues];

    // #INFO行（eBay公式フォーマットの必須ヘッダー）
    const info1 = '#INFO\tCreated=';
    const info2 = '#INFO\tVersion=1.0\t\t\tTemplate=fx_multi_category_template_EBAY_US';
    const info3 = '#INFO';

    // CSVはタブ区切りではなくカンマ区切りで出力
    const csvRows = [
      headers.map(esc).join(','),
      row.map(esc).join(','),
    ];

    const csv = csvRows.join('\r\n');
    const blob = new Blob([csv], {type: 'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'listing_' + (ebayTitle || 'export').slice(0, 30).replace(/[^\w]/g, '_') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleFiles = async files => {
    const arr=[];
    for (const f of Array.from(files)) {
      if(!f.type.startsWith('image/')) continue;
      const url = await new Promise(r => {
        const rd = new FileReader();
        rd.onload = e => r(e.target.result);
        rd.readAsDataURL(f);
      });
      arr.push({url, cloudinaryUrl: null, uploading: true, error: false});
    }
    setPhotos(p => {
      const next = [...p, ...arr];
      const startIdx = p.length;
      arr.forEach((_, i) => {
        const idx = startIdx + i;
        uploadToCloudinary(arr[i].url)
          .then(cloudinaryUrl => {
            setPhotos(prev => prev.map((x, j) =>
              j === idx ? {...x, cloudinaryUrl, uploading: false} : x
            ));
          })
          .catch(() => {
            setPhotos(prev => prev.map((x, j) =>
              j === idx ? {...x, uploading: false, error: true} : x
            ));
          });
      });
      return next;
    });
  };

  const ExtraEditor = ({extras,setExtras,onChat}) => (
    <div className="extra-list">
      <button className="btn bsec bsm" onClick={()=>addExtra(setExtras)} disabled={extras.length>=5}>＋ 詳細を追加</button>
      {extras.map((x,i)=>(
        <div key={x.id} className="extra-card">
          <div className="extra-head">
            <textarea
              value={x.jp}
              onChange={e=>updateExtra(setExtras,x.id,'jp',e.target.value)}
              placeholder="日本語で状態を入力"
            />
            <button className="xbtn" onClick={()=>removeExtra(setExtras,x.id)}>✕</button>
          </div>
          <input
            type="text"
            value={x.en}
            onChange={e=>updateExtra(setExtras,x.id,'en',e.target.value)}
            placeholder="ChatGPTの英文をここに貼り付け"
          />
        </div>
      ))}
      <button className="btn bblu bsm" onClick={onChat}>ChatGPTで相談</button>
    </div>
  );

  const hasFinder=HAS_FINDER.has(pType);
  const bOpts=BUNDLE_LIST;

  return (
    <div id="root">
      {/* ── Form panel ── */}
      <div className="fpanel">
        <div className="fpanel-header">
          <span className="fhtxt">Listing Generator</span>
        </div>
        <div className="fcontent">

          <div className="sec">
            <div className="sttl">商品タイプ</div>
            <div className="tgrid">
              {TYPES.map(t=><div key={t} className={`tbtn ${pType===t?'on':''}`} onClick={()=>{setPType(t);setBundles([]);}}>{t}</div>)}
            </div>
          </div>

          <div className="sec">
            <div className="sttl">コンディション</div>
            <div className="cwrap">
              {CONDITIONS.map(c=><div key={c} className={`cbtn ${cond===c?'on':''}`} onClick={()=>setCond(c)}>{c}</div>)}
            </div>
          </div>

          <div className="sec">
            <div className="sttl">基本情報</div>
            <div className="input-label">Brand</div>
            <input type="text" value={brand} onChange={e=>setBrand(e.target.value)} placeholder="Canon / Nikon / Mamiya ..." />
            <div className="input-label">Model</div>
            <input type="text" value={model} onChange={e=>setModel(e.target.value)} placeholder="AE-1 35mm SLR Film Camera Body" />

            <div className="input-label">特記キーワード（任意）</div>
            <div className="chklist">
              {SPECIALS.map(s=>(
                <div key={s} className={`chkbtn ${specials.includes(s)?'on':''}`} onClick={()=>toggleSpecial(s)}>
                  <span className="dot" />{s}
                </div>
              ))}
            </div>

            <div className="input-label">付属品 w/（任意）</div>
            <div className="chklist">
              {WITH_ITEMS.map(w=>(
                <div key={w} className={`chkbtn ${withItems.includes(w)?'on':''}`} onClick={()=>toggleWith(w)}>
                  <span className="dot" />{w}
                </div>
              ))}
            </div>

            <div className="input-label">カラー（任意）</div>
            <div className="chklist" style={{marginBottom:6}}>
              {['Black','Silver'].map(c=>(
                <div key={c} className={`chkbtn ${color===c?'on':''}`} onClick={()=>setColor(p=>p===c?'':c)}>
                  <span className="dot" />{c}
                </div>
              ))}
            </div>
            <input type="text" value={color} onChange={e=>setColor(e.target.value)} placeholder="Black / Silver / Chrome / White ..." />

            <div className="input-label">S/N or S/C（任意）</div>
            <div className="sn-wrap">
              <div className="sn-toggle-row">
                {['S/N','S/C'].map(t=>(
                  <div key={t} className={`sntgl ${snType===t?'on':''}`} onClick={()=>toggleSnType(t)}>{t}</div>
                ))}
              </div>
              {snType&&(
                <div className="sn-input-row">
                  <span className="prefix">{snType}</span>
                  <input type="text" value={snValue} onChange={e=>setSnValue(e.target.value)} placeholder={snType==='S/N'?'250XXXX':'9,514'} />
                </div>
              )}
            </div>

            <button className="btn bprim bfull" onClick={handleGenTitle} style={{marginTop:12}}>
              タイトルを組み立てる
            </button>
            <label>シリアルナンバー（ボディ）</label>
            <input type="text" value={serialBody} onChange={e=>setSerialBody(e.target.value)} placeholder="1234567" />
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:10}}>
              <input type="checkbox" id="lensSerialChk" checked={hasLensSerial} onChange={e=>setHasLensSerial(e.target.checked)} />
              <label htmlFor="lensSerialChk" style={{marginTop:0,marginBottom:0}}>レンズシリアル</label>
            </div>
            {hasLensSerial && (
              <input type="text" value={serialLens} onChange={e=>setSerialLens(e.target.value)} placeholder="1234567" style={{marginTop:6}} />
            )}
          </div>

          <div className="sec">
            <div className="sttl">Appearance</div>
            <div className="frow" style={{flexDirection:'column',gap:6}}>
              <div className={`fopt ${appChoice==='beautiful'?'on':''}`} onClick={()=>setAppChoice('beautiful')}>
                Appearance is beautiful. <span style={{color:'var(--mut)',fontSize:10,marginLeft:6}}>← Mint以上</span>
              </div>
              <div className={`fopt ${appChoice==='scuffs'?'on':''}`} onClick={()=>setAppChoice('scuffs')}>
                Tiny scuffs from normal use. <span style={{color:'var(--mut)',fontSize:10,marginLeft:6}}>← Near MINTの時</span>
              </div>
              <div className={`fopt ${appChoice==='signs'?'on':''}`} onClick={()=>setAppChoice('signs')}>
                It shows signs of use. <span style={{color:'var(--mut)',fontSize:10,marginLeft:6}}>← Exc+5以下の時</span>
              </div>
            </div>
          </div>

          <div className="sec">
            <div className="sttl">Optics</div>
            <OpBox title="Lens" op={lensOp} setOp={setLensOp} showBalsam={true} />
            <ExtraEditor extras={lensExtras} setExtras={setLensExtras} onChat={()=>handleChatOptics('Lens', lensOp, lensExtras)} />
            {hasFinder&&<OpBox title="Finder" op={finOp} setOp={setFinOp} showBalsam={true} />}
            {hasFinder&&(
              <ExtraEditor extras={finExtras} setExtras={setFinExtras} onChat={()=>handleChatOptics('Finder', finOp, finExtras)} />
            )}
          </div>

          <div className="sec">
            <div className="sttl">Functional</div>
            <div className="frow">
              <div className="fopt on">✓ It works properly.</div>
            </div>
            <ExtraEditor extras={funcExtras} setExtras={setFuncExtras} onChat={()=>handleChatFunctional(funcExtras)} />
          </div>

          <div className="sec">
            <div className="sttl">付属品</div>
            <div className="bgrid">
              {bOpts.map(n=>(
                <div key={n} className={`bi ${bundles.includes(n)?'on':''}`} onClick={()=>toggleBundle(n)}>
                  <input type="checkbox" readOnly checked={bundles.includes(n)} />
                  <span className="bilbl">{n}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="genbar">
            {genBusy&&<span style={{display:'flex',alignItems:'center',gap:5,color:'var(--mut)',fontSize:12}}><span className="spin"></span>AI処理中...</span>}
            <button className="btn bprim" onClick={handleGenerate} disabled={genBusy}>🤖 HTML生成</button>
          </div>
        </div>
      </div>

      {/* ── Right panel ── */}
      <div className="rpanel">
        <div className="rtabs">
          {[['html',' HTML'],['photos',' 写真加工']].map(([id,lbl])=>(
            <div key={id} className={`rtab ${rtab===id?'on':''}`} onClick={()=>setRtab(id)}>{lbl}</div>
          ))}
        </div>
        <div className="rcontent">

          {rtab==='html'&&(
            <div className="html-area">
              {titleCandidates.length>0&&(
                <div className="title-cands">
                  {titleCandidates.map((t,i)=>{
                    const isError=t.startsWith('Error:')||t.startsWith('Brand and Model');
                    const chars=t.length;
                    return (
                      <div key={i} className="cand">
                        <div className="cand-num">
                          {isError?'MESSAGE':`TITLE ${i+1}`}
                        </div>
                        <div className="cand-title">{isError?t:highlightTitle(t)}</div>
                        {!isError&&(
                          <div className="cand-foot">
                            <span className={`cand-chars ${chars>80?'over':''}`}>{chars} / 80</span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  {titleCandidates[0]&&!titleCandidates[0].startsWith('Error:')&&!titleCandidates[0].startsWith('Brand and Model')&&(
                    <>
                      <div className="input-label">確定タイトル入力欄</div>
                      <div className="final-title-box">
                        <input type="text" value={finalTitleInput} onChange={e=>setFinalTitleInput(e.target.value)} placeholder="" />
                        <button className="btn bsec bsm title-copy-status" onClick={handleCopyFinalTitle} disabled={!(ebayTitle || finalTitleInput).trim()}>
                          {finalTitleCopied?'✓':'⧉'}
                        </button>
                        <button className="btn bprim bsm" onClick={handleConfirmTitle}>確定</button>
                      </div>
                      <button className="btn bblu bfull" onClick={handleConsultChatGPT} style={{marginTop:8}}>
                        ChatGPTで相談
                      </button>
                      <button className="btn bsec bfull" onClick={handleGenerateItemSpecifics} disabled={itemSpecBusy||!ebayTitle} style={{marginTop:8}}>
                        {itemSpecBusy?<><span className="spin"></span> Item Specifics生成中...</>:'Item Specifics生成'}
                      </button>
                      {itemSpecError&&<div className="aapp" style={{color:'var(--red)',marginTop:8}}>{itemSpecError}</div>}
                      {Object.keys(itemSpecifics).length>0&&(
                        <div className="sec" style={{marginTop:10,marginBottom:0}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:8}}>
                            <div className="sttl" style={{marginBottom:0}}>Item Specifics</div>
                            <div style={{display:'flex',gap:7,alignItems:'center'}}>
                              {ebayTitle && Object.keys(itemSpecifics).length > 0 && (
                                <button className="btn bprim bsm" onClick={handleDownloadCsv}>⬇ CSV</button>
                              )}
                            </div>
                          </div>
                          {getItemSpecEntries(pType).map(({ key:k, kind })=>(
                            <div key={`${kind}:${k}`} style={{marginBottom:8}}>
                              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                                <div className="input-label" style={{marginTop:0}}>{k}</div>
                                {kind==='AI' && k==='Features' && itemSpecifics['Features'] && (
                                  <button className="rfbtn" onClick={handleVerifyFeatures} style={{marginBottom:4}}>
                                    ChatGPTで検証
                                  </button>
                                )}
                              </div>
                              <div className="spec-input-wrap">
                                <input
                                  type="text"
                                  value={kind==='AI' ? (itemSpecifics[k]||'') : (ITEM_SPEC_FIXED_VALUES[k] ?? '')}
                                  onChange={kind==='AI' ? e=>setItemSpecificValue(k,e.target.value) : undefined}
                                  readOnly={kind==='FIXED'}
                                  placeholder="N/A"
                                />
                                <button
                                  type="button"
                                  className={`spec-copy-btn ${copiedSpecKey===`${kind}:${k}`?'done':''}`}
                                  onClick={()=>copyItemSpecificValue(`${kind}:${k}`,kind==='AI' ? (itemSpecifics[k]||'') : (ITEM_SPEC_FIXED_VALUES[k] ?? ''))}
                                  title="コピー"
                                >
                                  {copiedSpecKey===`${kind}:${k}`?'✓':'⧉'}
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </>
                  )}
                </div>
              )}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
                <span style={{fontSize:11,color:'var(--mut)'}}>eBayの説明欄（HTMLモード）に貼り付け</span>
                <div style={{display:'flex',gap:7,alignItems:'center'}}>
                  {copied&&<span className="ok">✓ コピー完了</span>}
                  <button className="btn bblu bsm" onClick={handleCopy} disabled={!html}>📋 コピー</button>
                </div>
              </div>
              {html
                ?<div className="hout">{html}</div>
                :<div className="empty" style={{flex:1}}><div style={{fontSize:28,marginBottom:8}}>💻</div><h3>HTMLが未生成</h3><p style={{fontSize:11,marginTop:4}}>左のフォームを入力して<br/>「HTML生成」を押してください</p></div>
              }
            </div>
          )}

          {rtab==='photos' && (
            <div>
              <div className="dz"
                onClick={() => fileRef.current.click()}
                onDragOver={e => e.preventDefault()}
                onDrop={e => { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
              >
                <div style={{fontSize:24}}></div>
                <div style={{marginTop:6, fontSize:12, color:'var(--mut)'}}>
                  {"\u30c9\u30ed\u30c3\u30d7 or \u30af\u30ea\u30c3\u30af\u3067\u5199\u771f\u3092\u8ffd\u52a0"}
                </div>
              </div>
              <input
                ref={fileRef}
                type="file"
                multiple
                accept="image/*"
                style={{display:'none'}}
                onChange={e => handleFiles(e.target.files)}
              />
              {photos.length > 0 && (
                <>
                  <div style={{
                    display:'flex', justifyContent:'flex-end',
                    fontSize:11, color:'var(--mut)', margin:'8px 0 4px'
                  }}>
                    {"\u2601"} {photos.filter(p => p.cloudinaryUrl).length} / {photos.length} {"\u679a\u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u6e08\u307f"}
                  </div>
                  <div className="pgrid">
                    {photos.map((p, i) => (
                      <div key={i} className="pthumb">
                        <img src={p.url} alt="" />
                        <div className="pidx">{i + 1}</div>
                        <div style={{
                          position:'absolute', top:4, right:4,
                          fontSize:11, fontWeight:700, lineHeight:1
                        }}>
                          {p.uploading && <span style={{color:'var(--acc)'}}>{"\u2b06"}</span>}
                          {!p.uploading && p.cloudinaryUrl && <span style={{color:'var(--blu)'}}>{"\u2601"}</span>}
                          {!p.uploading && p.error && <span style={{color:'var(--red)'}}>{"\u26a0"}</span>}
                        </div>
                        <div className="pctrl">
                          <button
                            className="tgbtn"
                            style={{fontSize:10, padding:'2px 5px'}}
                            onClick={() => setPhotos(prev => prev.filter((_, j) => j !== i))}
                          >{"\u2715"}</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
